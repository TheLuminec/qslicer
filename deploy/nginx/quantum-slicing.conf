# ==========================================================================
# quantum-slicing.capstone.csi.miamioh.edu
#
# Install as /etc/nginx/sites-available/quantum-slicing and symlink into
# sites-enabled (or drop into /etc/nginx/conf.d/ on RHEL-family systems).
# Both locations are included from the http{} block, which is where the
# limit_req_zone below needs to be.
#
#   sudo ln -s /etc/nginx/sites-available/quantum-slicing \
#              /etc/nginx/sites-enabled/quantum-slicing
#   sudo nginx -t && sudo systemctl reload nginx
#
# This assumes the app is served by gunicorn on 127.0.0.1:8000 -- see
# deploy/quantum-slicer.service.
#
# READ deploy/README.md BEFORE ENABLING THIS. Analysing a Python circuit
# executes it on the server. The access control in this file is the thing
# standing between that and anyone who can reach the host.
# ==========================================================================

upstream quantum_slicer {
    server 127.0.0.1:8000;
    keepalive 8;
}

# Analysing a circuit starts a Python interpreter and imports Qiskit, so it is
# expensive in a way that ordinary page loads are not. One every two seconds per
# client, with room for a burst when somebody clicks through several examples.
limit_req_zone $binary_remote_addr zone=qslicer_analyze:1m rate=30r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name quantum-slicing.capstone.csi.miamioh.edu;

    access_log /var/log/nginx/quantum-slicing.access.log;
    error_log  /var/log/nginx/quantum-slicing.error.log;

    # ----------------------------------------------------------------------
    # Who may reach it
    #
    # Uncomment and set to the ranges that should have access. Everything this
    # site does is available to anyone who can open it, including running
    # Python on the server, so this is not a formality. Replace the example
    # range with the campus ranges you are actually given.
    # ----------------------------------------------------------------------
    # allow 134.53.0.0/16;      # campus
    # allow 10.0.0.0/8;         # VPN
    # deny  all;

    # Matches app.config["MAX_CONTENT_LENGTH"] in webapp/app.py. Keep the two
    # in step: nginx rejecting first gives a clearer error than Flask does.
    client_max_body_size 2m;

    # The site is same-origin only and loads no third-party anything.
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header Referrer-Policy          "same-origin"    always;

    # ----------------------------------------------------------------------
    # Static files: straight off disk, never through Python.
    # ----------------------------------------------------------------------
    location /static/ {
        alias /srv/quantum-slicer/webapp/static/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;                  # the page supplies its own inline icon
    }

    # ----------------------------------------------------------------------
    # The expensive endpoint, called out separately for its own limits.
    # QSLICER_PARSE_TIMEOUT is 20s by default, plus interpreter start-up, so
    # the read timeout has to leave room for a request that is legitimately
    # slow rather than stuck.
    # ----------------------------------------------------------------------
    location = /api/analyze {
        limit_req        zone=qslicer_analyze burst=10 nodelay;
        limit_req_status 429;

        proxy_pass       http://quantum_slicer;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
        proxy_buffering       on;
    }

    # ----------------------------------------------------------------------
    # Everything else: pages, the examples API, slicing.
    # ----------------------------------------------------------------------
    location / {
        proxy_pass       http://quantum_slicer;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}

# --------------------------------------------------------------------------
# When you have a certificate, keep the block above as a redirect and serve
# from 443. The app generates no absolute URLs, so nothing else needs to
# change; if that stops being true, turn on ProxyFix in webapp/wsgi.py so
# Flask believes X-Forwarded-Proto.
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name quantum-slicing.capstone.csi.miamioh.edu;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name quantum-slicing.capstone.csi.miamioh.edu;
#
#     ssl_certificate     /etc/ssl/certs/quantum-slicing.crt;
#     ssl_certificate_key /etc/ssl/private/quantum-slicing.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#
#     ... the same client_max_body_size, add_header and location blocks ...
# }
