<svg viewBox="0 -14 597 172" class="hero-graph" role="img"
         aria-label="Dependence graph of a superdense coding circuit, with a backward slice from the final measurement highlighted">

      <defs>
        <marker id="hero-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="5" markerHeight="5" orient="auto-start-reverse"
                markerUnits="strokeWidth">
          <path d="M 0 0 L 10 5 L 0 10 z" class="hero-arrowhead"></path>
        </marker>
        <marker id="hero-arrow-dim" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="5" markerHeight="5" orient="auto-start-reverse"
                markerUnits="strokeWidth">
          <path d="M 0 0 L 10 5 L 0 10 z" class="hero-arrowhead dim"></path>
        </marker>
      </defs>

      <g class="hero-wires">
        <line class="hero-wire" x1="30" y1="46" x2="585" y2="46"></line>
        <text class="hero-wire-label" x="22" y="50">q0</text>
        <line class="hero-wire" x1="30" y1="112" x2="585" y2="112"></line>
        <text class="hero-wire-label" x="22" y="116">q1</text>
      </g>

      <g class="hero-edges">
        <path class="hero-edge in-slice" marker-end="url(#hero-arrow)" d="M 101.0 46.0 Q 110.0 50.5 119.0 79.0"></path>
        <path class="hero-edge in-slice" marker-end="url(#hero-arrow)" d="M 179.0 79.0 Q 188.0 50.5 197.0 46.0"></path>
        <path class="hero-edge in-slice" marker-end="url(#hero-arrow)" d="M 179.0 79.0 Q 217.5 67.0 256.0 79.0"></path>
        <path class="hero-edge in-slice" marker-end="url(#hero-arrow)" d="M 238.0 46.0 Q 247.0 50.5 256.0 79.0"></path>
        <path class="hero-edge dim" marker-end="url(#hero-arrow-dim)" d="M 316.0 79.0 Q 325.0 50.5 334.0 46.0"></path>
        <path class="hero-edge in-slice" marker-end="url(#hero-arrow)" d="M 316.0 79.0 Q 403.0 83.5 490.0 112.0"></path>
        <path class="hero-edge dim" marker-end="url(#hero-arrow-dim)" d="M 375.0 46.0 Q 384.0 34.0 393.0 46.0"></path>
      </g>

      <g class="hero-nodes">
        <g class="hero-node in-slice cat-single" transform="translate(80.5,46.0)">
          <rect class="hero-shape" x="-20.5" y="-13.0" width="41" height="26" rx="6"></rect>
          <text class="hero-label" x="0" y="4">h q0</text>
          <text class="hero-index" x="0" y="-18">#0</text>
        </g>
        <g class="hero-node in-slice cat-multi" transform="translate(149.0,79.0)">
          <line class="hero-span" x1="0" y1="-33.0" x2="0" y2="33.0"></line>
          <circle class="hero-tick" cx="0" cy="-33.0" r="3.2"></circle>
          <circle class="hero-tick" cx="0" cy="33.0" r="3.2"></circle>
          <rect class="hero-shape" x="-30.0" y="-13.0" width="60" height="26" rx="6"></rect>
          <text class="hero-label" x="0" y="4">cx q0,1</text>
          <text class="hero-index" x="0" y="-18">#1</text>
        </g>
        <g class="hero-node in-slice cat-single" transform="translate(217.5,46.0)">
          <rect class="hero-shape" x="-20.5" y="-13.0" width="41" height="26" rx="6"></rect>
          <text class="hero-label" x="0" y="4">z q0</text>
          <text class="hero-index" x="0" y="-18">#2</text>
        </g>
        <g class="hero-node in-slice cat-multi" transform="translate(286.0,79.0)">
          <line class="hero-span" x1="0" y1="-33.0" x2="0" y2="33.0"></line>
          <circle class="hero-tick" cx="0" cy="-33.0" r="3.2"></circle>
          <circle class="hero-tick" cx="0" cy="33.0" r="3.2"></circle>
          <rect class="hero-shape" x="-30.0" y="-13.0" width="60" height="26" rx="6"></rect>
          <text class="hero-label" x="0" y="4">cx q0,1</text>
          <text class="hero-index" x="0" y="-18">#3</text>
        </g>
        <g class="hero-node dim cat-single" transform="translate(354.5,46.0)">
          <rect class="hero-shape" x="-20.5" y="-13.0" width="41" height="26" rx="6"></rect>
          <text class="hero-label" x="0" y="4">h q0</text>
          <text class="hero-index" x="0" y="-18">#4</text>
        </g>
        <g class="hero-node dim cat-measurement" transform="translate(432.5,46.0)">
          <rect class="hero-shape" x="-39.5" y="-13.0" width="79" height="26" rx="6"></rect>
          <text class="hero-label" x="0" y="4">measure q0</text>
          <text class="hero-index" x="0" y="-18">#5</text>
        </g>
        <g class="hero-node criterion cat-measurement" transform="translate(529.5,112.0)">
          <rect class="hero-shape" x="-39.5" y="-13.0" width="79" height="26" rx="6"></rect>
          <text class="hero-label" x="0" y="4">measure q1</text>
          <text class="hero-index" x="0" y="-18">#6</text>
        </g>
      </g>
    </svg>