[build-system]
# 77 is the first setuptools with PEP 639 license metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qslicer"
dynamic = ["version"]
description = "Static slicing and linting for quantum programs written in Qiskit or OpenQASM"
# The PyPI page; the root README.md is written for a checkout of the repository.
readme = "qslicer/README.md"
requires-python = ">=3.10"
# The team, as listed on the web app's team page (webapp/team.py).
authors = [
    { name = "Max Lovell" },
    { name = "Ethan Tackett" },
    { name = "Caleb Turner" },
    { name = "Dylan Kendall" },
]
license = "MIT"
# LintQ's MIT notice (qslicer/lint/lintq/port.py is a port of LintQ) ships as
# package data below, beside the port; listing it here too makes setuptools
# warn that qslicer.lint.lintq "would be ignored", since it sits in a package.
license-files = ["LICENSE"]
keywords = ["quantum", "qiskit", "openqasm", "slicing", "static analysis", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Quality Assurance",
]
# The static parsers, the quick checks' list of removed APIs (QS011) and the
# LintQ port are maintained against Qiskit 2.6; requirements.txt pins the exact
# versions the test suite runs on.
dependencies = [
    "qiskit>=2.6,<2.7",
    "networkx",
    "openqasm3[parser]>=1.0",
]

[project.optional-dependencies]
viz = ["matplotlib"]
# qslicer.parsers.openqasmparser goes through qiskit.qasm3, which needs it.
qasm3 = ["qiskit-qasm3-import>=0.6"]

[project.urls]
Repository = "https://github.com/TheLuminec/qslicer"
Issues = "https://github.com/TheLuminec/qslicer/issues"

[project.scripts]
qslicer = "qslicer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "qslicer.__version__" }

[tool.setuptools.packages.find]
include = ["qslicer*"]

[tool.setuptools.package-data]
qslicer = ["examples/*.py", "examples/*.qasm", "examples/manifest.json", "lint/lintq/README.md", "lint/lintq/LICENSE", "lint/lintq/codeql_support/*.py"]
