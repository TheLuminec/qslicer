# Builds qslicer and publishes it to PyPI.
#
#   Run it by hand (Actions tab > Release > Run workflow)  ->  TestPyPI
#   Push a tag such as v0.1.0                              ->  PyPI
#
# Both use PyPI's trusted publishing, so no API token is stored anywhere. The
# one-time setup and the release steps are in README.md, under "Releasing".

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing in this workflow may write to the repository. The publish jobs ask
# for the one extra permission they need themselves.
permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the pinned dependencies and qslicer
        run: pip install -r requirements.txt -e . pytest
      - name: Run the test suite
        # More room for libraries that need static TLS when loaded late, such
        # as qiskit_aer's libgomp (see tests/conftest.py).
        env:
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=16384
        run: pytest

  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          pip install build twine
          python -m build
      - name: Check the metadata PyPI will show
        run: twine check --strict dist/*
      - name: Check the tag matches qslicer.__version__
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/qslicer-${version}-py3-none-any.whl" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the built version:" dist/*
            exit 1
          fi
      - name: Install the wheel on its own and run the command
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/qslicer --version
          /tmp/smoke/bin/qslicer rules > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qslicer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version can be uploaded only once; a second run of the same
          # version skips it instead of failing.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qslicer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
